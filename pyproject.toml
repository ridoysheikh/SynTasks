[project]
name = "syntasks"
description = "Distributed async task queue for Python with built-in Redis support, by Synlor"
readme = "README.md"
requires-python = ">=3.11,<4"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "ridoysheikh", email = "ridoysheikh778@gmail.com" }, { name = "Synlor" }]
keywords = ["async", "asyncio", "distributed", "task-queue", "queue", "redis", "scheduler", "cron", "worker", "channels"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Distributed Computing",
  "Topic :: System :: Networking",
  "Typing :: Typed"
]
# The core library depends only on the Python standard library.
# Integrations with external ecosystems live in optional extras below.
dependencies = []
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/ridoysheikh/syntasks"
Source = "https://github.com/ridoysheikh/syntasks"
Issues = "https://github.com/ridoysheikh/syntasks/issues"
Changelog = "https://github.com/ridoysheikh/syntasks/blob/main/CHANGELOG.md"
Synlor = "https://synlor.com"

[project.scripts]
syntasks = "syntasks.__main__:main"

[project.entry-points.opentelemetry_instrumentor]
syntasks = "syntasks.instrumentation:SynTasksInstrumentor"

[project.entry-points.syntasks_cli]
run = "syntasks.cli.run:RunCMD"
config = "syntasks.cli.config_cmd:ConfigCMD"
queues = "syntasks.cli.ops:QueuesCMD"
schedules = "syntasks.cli.ops:SchedulesCMD"
channels = "syntasks.cli.ops:ChannelsCMD"
nodes = "syntasks.cli.ops:NodesCMD"
tasks = "syntasks.cli.ops:TasksCMD"
logs = "syntasks.cli.ops:LogsCMD"

[project.optional-dependencies]
cbor = ["cbor2>=5"]
metrics = ["prometheus_client>=0"]
msgpack = ["msgpack>=1.0.7"]
opentelemetry = [
  "opentelemetry-api (>=1.38.0,<2.0.0)",
  "opentelemetry-instrumentation (>=0.59b0,<1)",
  "opentelemetry-semantic-conventions (>=0.59b0,<1)",
  "psutil>=7",
]
orjson = ["orjson>=3"]
reload = ["watchdog>=4", "gitignore-parser>=0"]
uv = ["uvloop>=0.16.0,<1; sys_platform != 'win32'"]

[dependency-groups]
dev = [
  # type check
  "mypy>=1.18.2",
  # test
  "pytest>=9.0.1",
  "anyio>=4",  # pytest plugin for async tests
  "aiohttp>=3",  # HTTP server used by admin middleware tests
  "pytest-cov>=7.0.0",
  "pytest-xdist[psutil]>=3.8.0",
  "coverage>=7.11.3",
  "freezegun>=1.5.5",
  "polyfactory>=3.1.0",
  "opentelemetry-test-utils (>=0.59b0,<1)",
  # interoperability tests with third-party model libraries
  "pydantic>=2.5,<3.0",
  # lint
  "ruff>=0.16.7",
  "tzdata>=2026.4; sys_platform == 'win32'",
]
# `uv sync --group preview`: the web servers of test-preview/
preview = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "websockets>=13",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.coverage.run]
omit = [
  "src/syntasks/__main__.py",
  "src/syntasks/abc/cmd.py"
]

[tool.hatch.version]
path = "src/syntasks/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "CHANGELOG.md", "LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/syntasks"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_calls = false
disallow_subclassing_any = false
pretty = true
implicit_reexport = true
allow_untyped_decorators = true
warn_return_any = false
warn_unused_ignores = false

[tool.pytest]
log_level = "INFO"
anyio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
exclude = [".venv/"]
src = ["src", "."]
line-length = 88
# List of enabled rulsets.
# See https://docs.astral.sh/ruff/rules/ for more information.
lint.select = [
  "E",  # Error
  "F",  # Pyflakes
  "W",  # Pycodestyle
  "C90",  # McCabe complexity
  "I",  # Isort
  "N",  # pep8-naming
  "D",  # Pydocstyle
  "ANN",  # Pytype annotations
  "S",  # Bandit
  "B",  # Bugbear
  "COM",  # Commas
  "C4",  # Comprehensions
  "ISC",  # Implicit string concat
  "PIE",  # Unnecessary code
  "T20",  # Catch prints
  "PYI",  # validate pyi files
  "Q",  # Checks for quotes
  "RSE",  # Checks raise statements
  "RET",  # Checks return statements
  "SLF",  # Self checks
  "SIM",  # Simplificator
  "PTH",  # Pathlib checks
  "ERA",  # Checks for commented out code
  "PL",  # PyLint checks
  "RUF",  # Specific to Ruff checks
  "FA102",  # Future annotations
  "UP",  # Pyupgrade
  "G",  # flake8-logging-format
]
lint.ignore = [
  "D105",  # Missing docstring in magic method
  "D107",  # Missing docstring in __init__
  "D212",  # Multi-line docstring summary should start at the first line
  "D401",  # First line should be in imperative mood
  "D104",  # Missing docstring in public package
  "D100",  # Missing docstring in public module
  "ANN401",  # typing.Any are disallowed in `**kwargs
  "PLR0913",  # Too many arguments for function call
  "PLR0917",  # Too many positional arguments
  "D106",  # Missing docstring in public nested class
  "COM812",  # Conflicts with the formatter
]
lint.mccabe = { max-complexity = 10 }

[tool.ruff.lint.per-file-ignores]
"src/syntasks/dependencies/*" = [
  # Vendored from taskiq-dependencies; kept close to upstream.
  "C901",  # Function is too complex
  "N802",  # `Depends` keeps its public name
  "PLR0912",  # Too many branches
  "PLR0915",  # Too many statements
  "PYI034",  # __enter__ return type
]
"src/syntasks/cli/*" = [
  "T201",  # CLI commands print
  "C901",  # One branch per sub-command
  "PLR0911",
  "PLR0912",
  "PLR0915",
]
"src/syntasks/**/scripts.py" = [
  "E501",  # Lua source
  "UP031",
]
"src/syntasks/cluster/semaphore.py" = ["E501", "UP031"]  # Lua source with % substitution
"tests/**/*" = [
  "S101",  # Use of assert detected
  "S105",  # Hardcoded password (test credentials)
  "S106",  # Hardcoded password argument (test credentials)
  "S108",  # Temporary file paths in test data
  "S301",  # Use of pickle detected
  "D103",  # Missing docstring in public function
  "SLF001",  # Private member accessed
  "S311",  # Standard pseudo-random generators are not suitable for security/cryptographic purposes
  "D101",  # Missing docstring in public class
  "D102",  # Missing docstring in public method
  "PLR2004"  # Magic value
]
"examples/**/*" = [
  "D103",  # Missing docstring in public function
  "D101",  # Missing docstring in public class
  "D102",  # Missing docstring in public method
  "S311",  # Standard pseudo-random generators
  "S101",  # use of asserts detected
  "T201"  # print found
]
"test-preview/**/*" = [
  "E501",  # walkthrough prose
  "ISC004",  # step texts in tuples
  "S603",  # the walkthrough runs the shop and syntasks commands
  "D103",  # Missing docstring in public function
  "D101",  # Missing docstring in public class
  "D102",  # Missing docstring in public method
  "S311",  # Standard pseudo-random generators
  "S101",  # use of asserts detected
  "T201"  # print found
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "syntasks.dependencies.Depends",
  "syntasks.SynTasksDepends",
  "syntasks.Depends",
  "syntasks.config.schema.setting",
  "setting",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str", "float", "bytes"]

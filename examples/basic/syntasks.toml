# Run from this folder:
#   syntasks worker          # in one terminal
#   python send.py           # in another
[app]
name = "basic"
app = "tasks:app"

[redis]
url = "${REDIS_URL:-redis://localhost:6379/0}"

[worker]
processes = 2

# Operations settings beat code: this overrides timeout="30s" in tasks.py.
[tasks."tasks:add"]
timeout = "10s"

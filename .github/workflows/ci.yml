name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run ruff check src tests examples
      - run: uv run ruff format --check src tests examples
      - run: uv run mypy src tests

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install redis-server (the tests start their own)
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras
      - run: uv run pytest -q -n auto

  core-only:
    name: test (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: The wheel installs with nothing else
        run: |
          uv build --wheel
          uv venv /tmp/core --python 3.11
          uv pip install --python /tmp/core dist/*.whl
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/syntasks/__init__.py)
          test "$(uv pip freeze --python /tmp/core)" = "syntasks @ file://$PWD/dist/syntasks-$version-py3-none-any.whl"
          /tmp/core/bin/python -c "import syntasks; syntasks.SynTasks"
          /tmp/core/bin/syntasks --version
